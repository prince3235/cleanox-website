name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo ships a bun.lock — CI uses bun to stay reproducible.
      # Prefer npm? Commit a package-lock.json (`npm install --package-lock-only`)
      # and swap the steps below for the npm variant noted at the bottom.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: file:../db/custom.db

  # Recommended: enable Vercel's native Git integration — every PR gets a
  # preview URL, every push to main deploys to production automatically.
